# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 25

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'
# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Mouse follows focus when the focused window changes (right hand stays on the
# mouse, so the pointer lands on whatever the left hand just focused)
on-focus-changed = ['move-mouse window-lazy-center']

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 5
outer.bottom = 0
outer.top = 0
outer.right = 0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# Left-hand only: q/e (pinky + middle, skipping w). Wraps around the workspace,
# so these two keys reach every window without needing up/down.
alt-q = 'focus --boundaries-action wrap-around-the-workspace left'
alt-e = 'focus --boundaries-action wrap-around-the-workspace right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
# Left-hand only
alt-shift-q = 'move left'
alt-shift-e = 'move right'
# Right-hand vim cluster, kept for up/down
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1' # Reminders, Calendar
alt-2 = 'workspace 2' # 1Password,
alt-3 = 'workspace 3'
alt-keypad1 = 'workspace 1'
alt-keypad2 = 'workspace 2'
alt-keypad3 = 'workspace 3'
alt-a = 'workspace A' # Claude, ChatGPT
alt-b = 'workspace B' # Chrome
alt-c = 'workspace C' # Cursor
alt-o = 'workspace O' # Obsidian
alt-t = 'workspace T' # Teams
alt-w = 'workspace W' # WhatsApp, Telegram
alt-d = 'workspace D' # Discord, Slack
alt-f = 'workspace F' # Finder
alt-p = 'workspace P' # Preview
alt-r = 'workspace R' # Zotero
alt-s = 'workspace S' # 3D Slicer
alt-u = 'workspace U' # Utilities (settings panels, menu-bar app windows)

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-keypad1 = 'move-node-to-workspace 1'
alt-shift-keypad2 = 'move-node-to-workspace 2'
alt-shift-keypad3 = 'move-node-to-workspace 3'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-f = 'move-node-to-workspace F'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-r = 'move-node-to-workspace R'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-u = 'move-node-to-workspace U'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# Note: These commands will fail for workspaces with force assignment (see workspace-to-monitor-force-assignment)
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-ctrl-1 = 'move-workspace-to-monitor 1'
alt-ctrl-2 = 'move-workspace-to-monitor 2'
alt-ctrl-3 = 'move-workspace-to-monitor 3'
alt-ctrl-keypad1 = 'move-workspace-to-monitor 1'
alt-ctrl-keypad2 = 'move-workspace-to-monitor 2'
alt-ctrl-keypad3 = 'move-workspace-to-monitor 3'

# Example keybinding
alt-ctrl-f = 'macos-native-fullscreen'
cmd-ctrl-f = 'fullscreen'
alt-ctrl-t = 'layout floating tiling'

# Move the application to the next/prev monitor
# Moved off alt-shift-e/i: alt-shift-e is now 'move right'. Same q/e left-right
# axis as focus, one modifier up.
alt-ctrl-q = 'move-node-to-monitor --focus-follows-window prev'
alt-ctrl-e = 'move-node-to-monitor --focus-follows-window next'

# Move application between workspaces
alt-ctrl-left = ['move-node-to-workspace prev', 'workspace prev']
alt-ctrl-right = ['move-node-to-workspace next', 'workspace next']

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# [workspace-to-monitor-force-assignment]
# Commented out to allow manual workspace movement between monitors
# 1 = '1'
# 2 = '1'
# 3 = '1'
# 4 = '1'
# A = '1'
# B = '3'
# C = '2'
# O = '3'
# T = '2'
# W = '1'
# D = '1'
# F = '1'
# P = '2'
# U = '1'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Move applications to specific workspaces

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['layout tiling', 'move-node-to-workspace A']

# Chrome Picture-in-Picture windows - float them
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = 'Picture-in-Picture'
run = 'layout floating'

# Chrome Zoom windows (web client) - float them. Same reasoning as Meet: the
# meeting/overlay window is fixed-ish size and should never claim a tile, and it
# stays on whatever workspace you are on rather than being pulled to B.
#
# Zoom opens as a Chrome popup, so the window title is the MEETING TOPIC, not
# the app name - e.g. "Xihan Ma's Personal Meeting Room". There is no reliable
# "Zoom" substring to match, hence the topic-shaped patterns below. A meeting
# with a fully custom topic will still tile; float it with alt-ctrl-t and add
# its title shape here.
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = 'Personal Meeting Room|Zoom Meeting|Zoom Workplace|Launch Meeting|[Mm]eeting Room'
run = 'layout floating'

# Chrome Meet windows - float them
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = 'Meet '
run = 'layout floating'

# All other Chrome windows - tile and move to workspace B
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['layout tiling', 'move-node-to-workspace B']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['layout tiling', 'move-node-to-workspace O']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['layout tiling', 'move-node-to-workspace W']

[[on-window-detected]]
if.app-id = 'com.tdesktop.Telegram'
run = ['layout tiling', 'move-node-to-workspace W']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['layout tiling', 'move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['layout tiling', 'move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['layout tiling', 'move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = ['layout tiling', 'move-node-to-workspace P']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout tiling', 'move-node-to-workspace F']

[[on-window-detected]]
if.app-id = 'org.zotero.zotero'
run = ['layout tiling', 'move-node-to-workspace R']

# Cursor
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = ['layout tiling', 'move-node-to-workspace C']

# Zed
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['layout tiling', 'move-node-to-workspace C']

# 3D Slicer - CHD Observation panel floats over the viewer; must come BEFORE
# the catch-all below: first matching rule wins.
[[on-window-detected]]
if.app-id = 'org.slicer.slicer'
if.window-title-regex-substring = 'CHD Observation'
run = ['layout floating', 'move-node-to-workspace S']

# 3D Slicer - all other windows tile on S
[[on-window-detected]]
if.app-id = 'org.slicer.slicer'
run = ['layout tiling', 'move-node-to-workspace S']

# Superwhisper real windows (Settings/History/Models/Recordings) -> utilities
# workspace. Must come BEFORE the catch-all below: first matching rule wins.
[[on-window-detected]]
if.app-id = 'com.superduper.superwhisper'
if.window-title-regex-substring = '[Ss]ettings|[Hh]istory|[Mm]odels|[Rr]ecordings'
run = ['layout tiling', 'move-node-to-workspace U']

# Superwhisper recorder overlay - untitled, fixed-size. Kept floating so it never
# claims a tile (this was eating the right half of workspace O), and parked on U
# with the rest of the Superwhisper windows.
[[on-window-detected]]
if.app-id = 'com.superduper.superwhisper'
run = ['layout floating', 'move-node-to-workspace U']

# ---- Menu-bar agent apps (LSUIElement=1) ----------------------------------
# Float only, NO workspace move. Their popovers/palettes have to open on
# whatever workspace you are already on, so they must not be relocated.

# Stats
[[on-window-detected]]
if.app-id = 'eu.exelban.Stats'
run = 'layout floating'

# Tailscale
[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macos'
run = 'layout floating'

# Raycast
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# FortiTray (menu-bar item)
[[on-window-detected]]
if.app-id = 'com.fortinet.forticlient.macos.vpn'
run = 'layout floating'

# FortiClientAgent
[[on-window-detected]]
if.app-id = 'com.fortinet.forticlient.FortiClientAgent'
run = 'layout floating'

# FctMiscAgent
[[on-window-detected]]
if.app-id = 'com.fortinet.FctMiscAgent'
run = 'layout floating'

# ---- Utilities workspace (U) ----------------------------------------------
# Settings panels and one-off tool windows. Tiled, since U is where they live.

# System Settings
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout tiling', 'move-node-to-workspace U']

# Activity Monitor
[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['layout tiling', 'move-node-to-workspace U']

# Passwords
[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = ['layout tiling', 'move-node-to-workspace U']

# OrbStack
[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = ['layout tiling', 'move-node-to-workspace U']

# AnyDesk
[[on-window-detected]]
if.app-id = 'com.philandro.anydesk'
run = ['layout tiling', 'move-node-to-workspace U']

# Raspberry Pi Imager
[[on-window-detected]]
if.app-id = 'com.raspberrypi.rpi-imager'
run = ['layout tiling', 'move-node-to-workspace U']

# FortiClient main GUI window
[[on-window-detected]]
if.app-id = 'com.fortinet.FortiClient'
run = ['layout tiling', 'move-node-to-workspace U']

# Terminal - always floating
[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'layout floating'

# iTerm2 - always floating
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'layout floating'
